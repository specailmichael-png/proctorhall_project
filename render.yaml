services:
  - type: web
    name: proctorhall-project
    runtime: python
    plan: free
    rootDir: proctorhall
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py bootstrap_admin && gunicorn proctorhall_site.wsgi:application
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
